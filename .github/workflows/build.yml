name: Build Utah Base and Custom OS

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - ".github/workflows/build-sealed.yml"
      - "cosign.pub"
      - "files/**"
      - "recipes/**"
      - "seal/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-utah:
    name: Verify Utah package image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@v6

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Verify Utah signature and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="$(sed -n 's/^ARG UTAH_PACKAGES_IMAGE=//p' seal/Containerfile.base)"
          [[ "$image" =~ ^ghcr\.io/projectbluefin/utah-packages@sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::Utah image must be pinned by digest"; exit 1; }

          cosign verify "$image" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github[.]com/projectbluefin/utah-packages/[.]github/workflows/(rebuild-rpms|publish-repository)[.]yml@refs/heads/main$'
          gh attestation verify "oci://${image}" \
            --repo projectbluefin/utah-packages

  build-base:
    name: Build and publish prepared base
    needs: verify-utah
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push prepared base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: seal/Containerfile.base
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/neret/hummingbird-base-prep:latest
            ghcr.io/neret/hummingbird-base-prep:${{ github.sha }}

  build-custom-os:
    name: Build and publish unsealed OS
    needs: build-base
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: recipes/recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          maximize_build_space: true
